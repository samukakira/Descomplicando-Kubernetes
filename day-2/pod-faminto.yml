apiVersion: v1
kind: Pod
metadata:
  namespace: treinamento-ch2
  labels:
    run: pod-faminto
  name: pod-faminto
spec:
  containers:
  - image: polinux/stress
    name: pod-faminto
    command: ["/bin/sh", "-c"]
    args:
    - stress --vm 1 --vm-bytes 250M --vm-hang 1
    resources:
      limits:
        memory: "200Mi"
      requests:
        memory: "100Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
